name: IPAVault
options:
  bundleIdPrefix: com.ipavault
  deploymentTarget:
    iOS: "16.4"
  xcodeVersion: "16.0"

packages:
  MapleSAP:
    path: MapleSyrup/SAPKit

targets:
  IPAVault:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: Sources
    dependencies:
      - package: MapleSAP
        product: MapleSAP
    settings:
      base:
        PRODUCT_NAME: IPAVault
        PRODUCT_BUNDLE_IDENTIFIER: com.ipavault.sidestore
        MARKETING_VERSION: "3.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge/SAP-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/build/Native/include"
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/build/Native"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-Wl,-export_dynamic"
          - "-Wl,-force_load,$(PROJECT_DIR)/build/Native/libunicorn.a"
          - "$(PROJECT_DIR)/build/Native/libWaffleSAP.a"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: IPAVault
        CFBundleName: IPAVault
        CFBundleShortVersionString: "3.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
